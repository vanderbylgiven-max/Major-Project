
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="login-box">

    <h2>Student Portal</h2>

    <!-- ANNOUNCEMENTS -->
    <div class="announcement-box">
        <h3>Announcements</h3>
        <p>📅 Semester Registration Open</p>
        <p>📝 Exams Start 15 June 2026</p>
        <p>📢 Campus WiFi Maintenance Friday</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">

        <input type="text" id="loginUsername" placeholder="Username">

        <div class="password-box">
            <input type="password" id="loginPassword" placeholder="Password">
            <span onclick="togglePassword()">👁</span>
        </div>

        <button onclick="login()">Login</button>

        <p class="switch-text">
            Don't have an account?
            <span onclick="showRegister()">Create Account</span>
        </p>

        <p class="switch-text">
            <span onclick="showForgot()">Forgot Password?</span>
        </p>

    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">

        <input type="text" id="fullName" placeholder="Full Name">
        <input type="text" id="newUsername" placeholder="Username">
        <input type="email" id="email" placeholder="Student Email">

        <div class="password-box">
            <input type="password" id="newPassword" placeholder="Password">
            <span onclick="toggleRegisterPassword()">👁</span>
        </div>

        <div class="password-box">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <span onclick="toggleConfirmPassword()">👁</span>
        </div>

        <input type="file" id="profilePic">

        <button onclick="register()">Register</button>

        <p class="switch-text">
            Already have an account?
            <span onclick="showLogin()">Login</span>
        </p>

    </div>

    <!-- FORGOT PASSWORD -->
    <div id="forgotForm" style="display:none;">

        <input type="text" id="forgotUsername" placeholder="Username">
        <input type="email" id="forgotEmail" placeholder="Email">

        <div class="password-box">
            <input type="password" id="forgotPassword" placeholder="New Password">
            <span onclick="toggleForgotPassword()">👁</span>
        </div>

        <div class="password-box">
            <input type="password" id="forgotConfirmPassword" placeholder="Confirm Password">
            <span onclick="toggleForgotConfirmPassword()">👁</span>
        </div>

        <button onclick="resetPassword()">Reset Password</button>

        <p class="switch-text">
            <span onclick="showLogin()">Back to Login</span>
        </p>

    </div>

    <p id="error"></p>

</div>

<script src="script.js"></script>
</body>
</html>
