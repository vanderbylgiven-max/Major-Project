<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="student-dashboard.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">
        <h2>LIMKOKWING</h2>
        <p>Student Portal</p>
    </div>
    <ul>
        <li><a href="#dashboard">Dashboard</a></li>
        <li><a href="#courses">Courses</a></li>
        <li><a href="#results">Results</a></li>
        <li><a href="#profile">Profile</a></li>
        <li onclick="logout()" class="logout-btn">Logout</li>
    </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- HEADER -->
    <div class="header" id="dashboard">
        <img id="profileImage" class="profile-pic">
        <h1 id="welcomeText"></h1>
        <p id="studentText"></p>
        <p id="lastLoginText"></p>
    </div>

    <!-- CARDS -->
    <div class="cards">
        <div class="card">
            <h3>Total Courses</h3>
            <p>6</p>
        </div>
        <div class="card">
            <h3>Attendance</h3>
            <p>92%</p>
        </div>
        <div class="card">
            <h3>Assignments</h3>
            <p>3</p>
        </div>
    </div>

    <!-- PROFILE -->
    <div class="section" id="profile">
        <h2>Student Profile</h2>
        <p><strong>Name:</strong> <span id="name"></span></p>
        <p><strong>ID:</strong> <span id="id"></span></p>
    </div>

    <!-- CHANGE PASSWORD -->
    <div class="section">
        <h2>Change Password</h2>
        <input type="password" id="newChangedPassword" placeholder="New Password">
        <button onclick="changePassword()">Change Password</button>
        <p id="pwMsg"></p>
    </div>

</div>

<script>

// LOGIN CHECK
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}

// DISPLAY USER INFO
document.getElementById("welcomeText").innerText = "Welcome Back, " + localStorage.getItem("studentName") + " 👋";
document.getElementById("studentText").innerText = "Student ID: " + localStorage.getItem("studentID");
document.getElementById("name").innerText = localStorage.getItem("studentName");
document.getElementById("id").innerText = localStorage.getItem("studentID");
document.getElementById("lastLoginText").innerText = "Last Login: " + (localStorage.getItem("lastLogin") || "N/A");

// PROFILE IMAGE
const pic = localStorage.getItem("profilePic");
if (pic) document.getElementById("profileImage").src = pic;

// LOGOUT
function logout() {
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("studentName");
    localStorage.removeItem("studentID");
    localStorage.removeItem("profilePic");
    window.location.href = "login.html";
}

// CHANGE PASSWORD - now saves to database
async function changePassword() {
    const newPass = document.getElementById("newChangedPassword").value;
    const msg     = document.getElementById("pwMsg");

    if (newPass.length < 6) {
        msg.style.color = "red";
        msg.innerText   = "Password must be at least 6 characters";
        return;
    }

    const body = new FormData();
    body.append("action",   "changePassword");
    body.append("studentID", localStorage.getItem("studentID"));
    body.append("password",  newPass);

    const res  = await fetch("api.php", { method: "POST", body });
    const data = await res.json();

    if (data.success) {
        msg.style.color = "green";
        msg.innerText   = "Password changed successfully";
        document.getElementById("newChangedPassword").value = "";
    } else {
        msg.style.color = "red";
        msg.innerText   = "Failed to change password";
    }
}

</script>
</body>
</html>
